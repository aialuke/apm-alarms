# A topic is a button only when its id is listed for that unit and list.
# A missing id is a dash. The lists below are the button order.
# A unit shortcut exists only as a row here. Remote and RF module have none.
# The title under topics is the button and the page heading. A file name is not a title.
lists:
  setup:
    label: Setup
    other: troubleshooting
    switch_label: Troubleshoot this alarm
  troubleshooting:
    label: Troubleshooting
    # Testing is not a button here, but Troubleshooting pages open it, and it must show Troubleshooting.
    also: [testing]
    other: setup
    switch_label: Set up this alarm

switches:
  - from: wired
    to: wireless
    label: View Wireless alarm
  - from: wireless
    to: wired
    label: View Wired alarm

units:
  wired:
    label: Wired alarm
    setup: [placement, opening, pairing, testing]
    troubleshooting: [signal, placement, pairing]
  wireless:
    label: Wireless alarm
    setup: [placement, mounting, activation, pairing, testing]
    troubleshooting: [signal, placement, pairing]
  rf:
    label: RF module
    # One page, no lists. It is just the fitting diagram.
    combine: [fitting]
  remote:
    label: Remote
    # One page, no lists. These are its sections, in order.
    combine: [activation, pairing, use]

topics:
  placement:
    title: Placement
    # Same words for every brand. These includes are the pages, and a brand file for this topic is ignored.
    shared:
      setup: setup-placement.html
      troubleshooting: setup-placement.html
  opening:
    title: Opening
  pairing:
    title: Pairing
  testing:
    title: Testing
  mounting:
    title: Mounting
  activation:
    title: Activation
  use:
    title: Use
  fitting:
    title: Fitting
  signal:
    title: Lights & Sounds
