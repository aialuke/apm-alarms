# A topic is a button only when its id is listed for that unit and list.
# A missing id is a dash. The lists below are the button order.
# A unit shortcut exists only as a row here. Remote and RF module have none.
# The title under topics is the button and the page heading. A file name is not a title.
lists:
  setup:
    label: Setup
    other: troubleshooting
    switch_label: Troubleshoot this alarm
  troubleshooting:
    label: Troubleshooting
    other: setup
    switch_label: Set up this alarm

switches:
  - from: wired
    to: wireless
    label: View Wireless alarm
  - from: wireless
    to: wired
    label: View Wired alarm

units:
  wired:
    label: Wired alarm
    setup: [placement, opening, pairing, testing]
    troubleshooting: [signal, power, quiet, false-alarms, placement, pairing]
  wireless:
    label: Wireless alarm
    setup: [placement, mounting, activation, pairing, testing]
    troubleshooting: [signal, power, quiet, false-alarms, placement, pairing]
  rf:
    label: RF module
    setup: [fitting]
    troubleshooting: []
  remote:
    label: Remote
    setup: [activation, pairing, use]
    troubleshooting: [signal, remote-dead, pairing, locate]

topics:
  placement:
    title: Placement
  opening:
    title: Opening
  pairing:
    title: Pairing
  testing:
    title: Testing
  mounting:
    title: Mounting
  activation:
    title: Activation
  fitting:
    title: Fitting
  use:
    title: Use
  signal:
    title: What's that light or sound?
  power:
    title: Won't power on.
  quiet:
    title: Not going off when other alarms go off.
  false-alarms:
    title: Customer reports false alarms.
  remote-dead:
    title: Remote won't work.
  locate:
    title: Locate
