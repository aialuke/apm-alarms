---
layout: default
---
<header class="nav nav-large">
  <h1>Brands</h1>
</header>
<main>
  <nav aria-label="Brands">
    <ul class="grid">
      {% for brand in site.data.brands %}
        <li>
          <a class="tile" href="{{ '/' | append: brand.id | append: '/' | relative_url }}">{{ brand.name }}</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</main>
