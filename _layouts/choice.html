---
layout: default
---
<header class="nav">
  <nav class="route" aria-label="What you picked">
    <a href="{{ '/' | append: page.brand | append: '/' | relative_url }}">{{ page.brand_name }}</a>
    <h1 aria-current="page">{{ page.unit_name }}</h1>
  </nav>
</header>
<main>
<ul class="choices">
  {% for list in page.lists %}
    <li>
      <a href="{{ '/' | append: page.brand | append: '/' | append: page.unit | append: '/' | append: list.id | append: '/' | relative_url }}">
        {% include row-icon.html kind=list.id %}
        <span class="row-label">{{ list.label }}</span>
        {% include chevron.html %}
      </a>
    </li>
  {% endfor %}
</ul>
</main>
