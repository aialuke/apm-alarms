---
layout: default
---
<nav class="route" aria-label="What you picked">
  <a href="{{ '/' | append: page.brand | append: '/' | relative_url }}">{{ page.brand_name }}</a>
  <span class="sep" aria-hidden="true">›</span>
  <span>{{ page.unit_name }}</span>
</nav>
<h1>{{ page.unit_name }}</h1>
<div class="stack">
  {% for list in page.lists %}
    <a class="choice" href="{{ '/' | append: page.brand | append: '/' | append: page.unit | append: '/' | append: list | append: '/' | relative_url }}">
      {% if list == "setup" %}Setup{% else %}Troubleshooting{% endif %}
    </a>
  {% endfor %}
</div>
