---
layout: default
---
<nav class="route" aria-label="What you picked">
  <a href="{{ '/' | append: page.brand | append: '/' | relative_url }}">{{ page.brand_name }}</a>
  <span class="sep" aria-hidden="true">›</span>
  <a href="{{ '/' | append: page.brand | append: '/' | append: page.unit | append: '/' | relative_url }}">{{ page.unit_name }}</a>
  <span class="sep" aria-hidden="true">›</span>
  <span>{{ page.list_name }}</span>
</nav>
<h1>{{ page.list_name }}</h1>
<div class="choices">
  {% for topic in page.topics %}
    <a href="{{ topic.href | relative_url }}">{{ topic.title }}</a>
  {% endfor %}
</div>
{% if page.shortcuts.size > 0 %}
<div class="shortcuts">
  {% for shortcut in page.shortcuts %}
    <a href="{{ shortcut.href | relative_url }}">{{ shortcut.label }}</a>
  {% endfor %}
</div>
{% endif %}
