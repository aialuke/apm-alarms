<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141a22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="APM Alarms">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
</head>
<body class="{% if page.hide_bar %}is-home{% endif %}" data-home="{{ '/' | relative_url }}">
  {{ content }}
  {% unless page.hide_bar %}
    {% include bar.html %}
  {% endunless %}
  <script src="{{ '/assets/trail.js' | relative_url }}" defer></script>
</body>
</html>
