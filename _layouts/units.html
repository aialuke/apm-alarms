---
layout: default
---
<header class="nav">
  <nav class="route" aria-label="What you picked">
    <span>{{ page.brand_name }}</span>
  </nav>
  <h1>Unit</h1>
</header>
<div class="choices">
  {% for item in site.pages %}
    {% if item.layout == "choice" and item.brand == page.brand %}
      <a href="{{ item.url | relative_url }}">
        {% include row-icon.html kind=item.unit %}
        <span class="row-label">{{ item.unit_name }}</span>
        {% include chevron.html %}
      </a>
    {% endif %}
  {% endfor %}
</div>
