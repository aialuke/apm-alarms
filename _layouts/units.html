---
layout: default
---
<header class="nav">
  <nav class="route" aria-label="What you picked">
    <span class="context">{{ page.brand_name }}</span>
    <h1 aria-current="page">Unit</h1>
  </nav>
</header>
<main>
<ul class="choices">
  {% for unit in page.units %}
    <li>
      <a href="{{ unit.href | relative_url }}">
        {% include row-icon.html kind=unit.id %}
        <span class="row-label">{{ unit.label }}</span>
        {% include chevron.html %}
      </a>
    </li>
  {% endfor %}
</ul>
</main>
