<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f6b5c">
<title>APM Alarms mockup: step layouts</title>
<style>
  :root {
    --bg: #f6f7f8;
    --card: #ffffff;
    --text: #15191d;
    --muted: #5b6670;
    --brand: #0f6b5c;
    --brand-ink: #ffffff;
    --tip-bg: #fff4d6;
    --tip-border: #f0b429;
    --line: #dde2e6;
    --photo: #e8eef0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418;
      --card: #1a2026;
      --text: #f2f5f7;
      --muted: #a3afb9;
      --brand: #3fbf9f;
      --brand-ink: #08201a;
      --tip-bg: #3a2f10;
      --tip-border: #f0b429;
      --line: #2c353d;
      --photo: #232b33;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 19px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; }

  .picker {
    position: sticky; top: 0; z-index: 5;
    background: var(--brand); color: var(--brand-ink);
    padding: calc(10px + env(safe-area-inset-top)) 14px 12px;
  }
  .picker p { margin: 0 0 8px; font-size: 15px; opacity: .9; }
  .picker .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(0,0,0,.18); padding: 4px; border-radius: 14px; }
  .picker .seg button {
    border: 0; border-radius: 10px; padding: 12px 6px; background: transparent;
    color: var(--brand-ink); font-weight: 600; font-size: 16px; min-height: 48px;
  }
  .picker .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); }

  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 16px 4px; }
  .crumbs span {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 15px; font-weight: 600;
  }
  h1 { font-size: 28px; margin: 6px 16px 12px; }

  main { flex: 1; display: flex; flex-direction: column; }

  .photo {
    background: var(--photo); border-radius: 18px; aspect-ratio: 4 / 3;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .photo svg { width: 78%; height: auto; }
  .caption { font-size: 14px; color: var(--muted); margin: 6px 2px 0; }

  .tip {
    background: var(--tip-bg); border-left: 6px solid var(--tip-border);
    border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 17px;
  }
  .tip strong { display: block; margin-bottom: 2px; }

  .signal {
    display: flex; gap: 10px; align-items: center; margin-top: 12px;
    font-size: 17px; font-weight: 600;
  }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #e53935; flex: none; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  /* Layout A: one step per screen */
  #a { flex: 1; display: flex; flex-direction: column; padding: 0 16px; }
  #a .count { font-size: 16px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  #a .text { font-size: 24px; line-height: 1.35; font-weight: 600; margin-top: 14px; }
  #a .spacer { flex: 1; min-height: 16px; }
  #a .nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 0 10px; }
  .big {
    min-height: 64px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--card); font-size: 20px; font-weight: 700;
  }
  .big.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .big:disabled { opacity: .35; }
  .link { background: none; border: 0; color: var(--brand); font-weight: 700; padding: 10px 0; text-align: center; width: 100%; min-height: 48px; }

  /* Layout B: all steps on one page */
  #b { padding: 0 16px; }
  #b ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  #b li {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; margin-bottom: 14px;
  }
  #b .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: var(--brand-ink);
    font-weight: 800; margin-right: 10px; flex: none;
  }
  #b .row { display: flex; align-items: flex-start; margin-top: 12px; }
  #b .row p { margin: 4px 0 0; font-size: 20px; font-weight: 600; }

  .bottom { padding: 6px 16px 18px; border-top: 1px solid var(--line); margin-top: 8px; }
  .bottom p { margin: 10px 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .next-alarm { width: 100%; margin-top: 10px; }
  .note { font-size: 13px; color: var(--muted); text-align: center; padding: 6px 16px 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="picker">
  <p>Mockup. Try both, then tell me which feels better on a ladder.</p>
  <div class="seg" role="group" aria-label="Layout">
    <button id="pickA" aria-pressed="true">A: One step per screen</button>
    <button id="pickB" aria-pressed="false">B: All steps on one page</button>
  </div>
</div>

<div class="crumbs" aria-label="What you picked">
  <span>Emerald</span><span>Wired</span><span>Setup</span><span>Pairing</span>
</div>
<h1>Pairing</h1>

<main>
  <section id="a" aria-live="polite">
    <div class="count" id="aCount"></div>
    <div class="photo" id="aPhoto"></div>
    <div class="caption" id="aCaption"></div>
    <div class="text" id="aText"></div>
    <div id="aExtra"></div>
    <div class="spacer"></div>
    <button class="link" id="seeAll">See all steps</button>
    <div class="nav">
      <button class="big" id="back">Back</button>
      <button class="big primary" id="next">Next</button>
    </div>
  </section>

  <section id="b" hidden>
    <ol id="bList"></ol>
  </section>
</main>

<div class="bottom">
  <p>Same topic for another unit</p>
  <div class="switch">
    <button class="big">Wireless</button>
    <button class="big">Remote</button>
  </div>
  <button class="big next-alarm">Next alarm</button>
</div>
<div class="note">Steps taken from the Emerald RF module and remote manuals. Not yet checked on a real unit.</div>

<script>
  const alarm = (extra) => `
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <rect x="0" y="0" width="200" height="14" fill="#b8c2c8"/>
      <ellipse cx="100" cy="70" rx="78" ry="44" fill="#fdfdfd" stroke="#9aa6ad" stroke-width="3"/>
      <ellipse cx="100" cy="66" rx="30" ry="17" fill="#eef2f4" stroke="#9aa6ad" stroke-width="2"/>
      <text x="100" y="71" font-size="11" text-anchor="middle" fill="#56636b" font-family="sans-serif">TEST/HUSH</text>
      <circle cx="150" cy="62" r="5" fill="#e53935"/>
      ${extra}
    </svg>`;
  const finger = (label) => `
    <path d="M92 150 L92 96 Q100 84 108 96 L108 150 Z" fill="#f2c6a0" stroke="#c8936b" stroke-width="2"/>
    <text x="150" y="128" font-size="26" font-weight="700" text-anchor="middle" fill="#0f6b5c" font-family="sans-serif">${label}</text>`;
  const chirp = `<path d="M168 40 q10 10 0 20 M176 34 q16 16 0 32" stroke="#0f6b5c" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  const two = `
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <ellipse cx="55" cy="70" rx="45" ry="28" fill="#fdfdfd" stroke="#9aa6ad" stroke-width="3"/>
      <ellipse cx="145" cy="70" rx="45" ry="28" fill="#fdfdfd" stroke="#9aa6ad" stroke-width="3"/>
      <text x="55" y="118" font-size="13" text-anchor="middle" fill="#56636b" font-family="sans-serif">Master</text>
      <text x="145" y="118" font-size="13" text-anchor="middle" fill="#56636b" font-family="sans-serif">Next unit</text>
      <path d="M92 50 q8 -10 16 0 M86 42 q14 -18 28 0" stroke="#0f6b5c" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>`;

  const steps = [
    {
      text: "Pick any unit to be the master. Press its Test/Hush button 3 times, quickly.",
      photo: alarm(finger("×3")),
      caption: "Photo: finger on the Test/Hush button",
      signal: "Red light flashes: the master is in pairing mode.",
      tip: "If pairing mode won't start, take the battery out, hold Test/Hush for more than 2 seconds to drain leftover power, then put the battery back and try again."
    },
    {
      text: "Go to the next unit. Press its Test/Hush button 3 times, quickly.",
      photo: two,
      caption: "Photo: the next unit pairing with the master",
      signal: "One chirp: this unit is paired.",
    },
    {
      text: "Repeat on every other unit at the site, wired and wireless.",
      photo: alarm(chirp),
      caption: "Photo: a unit chirping after pairing",
    },
    {
      text: "Go back to the master and press Test/Hush once to finish.",
      photo: alarm(finger("×1")),
      caption: "Photo: finger on the master's Test/Hush button",
      tip: "Then go to Testing, to check every unit goes off together."
    },
  ];

  const extra = (s) =>
    (s.signal ? `<div class="signal"><span class="dot"></span>${s.signal}</div>` : "") +
    (s.tip ? `<div class="tip"><strong>Tip</strong>${s.tip}</div>` : "");

  let i = 0;
  const $ = (id) => document.getElementById(id);
  function renderA() {
    const s = steps[i];
    $("aCount").textContent = `Step ${i + 1} of ${steps.length}`;
    $("aPhoto").innerHTML = s.photo;
    $("aCaption").textContent = s.caption;
    $("aText").textContent = s.text;
    $("aExtra").innerHTML = extra(s);
    $("back").disabled = i === 0;
    $("next").textContent = i === steps.length - 1 ? "Done" : "Next";
  }
  $("bList").innerHTML = steps.map((s, n) => `
    <li>
      <div class="photo">${s.photo}</div>
      <div class="caption">${s.caption}</div>
      <div class="row"><span class="num">${n + 1}</span><p>${s.text}</p></div>
      ${extra(s)}
    </li>`).join("");

  function show(layout) {
    $("a").hidden = layout !== "a";
    $("b").hidden = layout !== "b";
    $("pickA").setAttribute("aria-pressed", layout === "a");
    $("pickB").setAttribute("aria-pressed", layout === "b");
    window.scrollTo({ top: 0 });
  }
  $("pickA").onclick = () => show("a");
  $("pickB").onclick = () => show("b");
  $("seeAll").onclick = () => show("b");
  $("next").onclick = () => { if (i < steps.length - 1) { i++; renderA(); } else { i = 0; renderA(); } };
  $("back").onclick = () => { if (i > 0) { i--; renderA(); } };
  renderA();
</script>
</body>
</html>
